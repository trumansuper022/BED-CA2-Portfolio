<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Register | MinePets</title>
    <link
      href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'
      rel='stylesheet'
    />
    <link href='https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap' rel='stylesheet' />
    <link href='/public/css/style.css' rel='stylesheet' />
  </head>
  <body>
            <nav class='navbar navbar-expand-lg navbar-dark mc-navbar'>
      <div class='container'>
        <a class='mc-brand' href='/index.html'>
          <img src='/public/img/minecrafticon.jpg' class='mc-logo' alt='logo' />
          MinePets
        </a>
        <button
          class='navbar-toggler'
          type='button'
          data-bs-toggle='collapse'
          data-bs-target='#navbarNav'
          aria-controls='navbarNav'
          aria-expanded='false'
          aria-label='Toggle navigation'
        >
          <span class='navbar-toggler-icon'></span>
        </button>
        <div class='collapse navbar-collapse' id='navbarNav'>
          <ul class='navbar-nav me-auto'>
            <li class='nav-item'><a class='nav-link' href='/index.html'>Home</a></li>
            <li class='nav-item'><a class='nav-link' href='/users.html'>Crafters</a></li>
            <li class='nav-item'><a class='nav-link' href='/challenges.html'>Challenges</a></li>
            <li class='nav-item'><a class='nav-link' href='/completions.html'>Completions</a></li>
            <li class='nav-item'><a class='nav-link' href='/items.html'>Items</a></li>
            <li class='nav-item'><a class='nav-link' href='/itemshop.html'>Item Shop</a></li>
            <li class='nav-item'><a class='nav-link' href='/mobshop.html'>Mob Shop</a></li>
            <li class='nav-item'><a class='nav-link' href='/minepet.html'>Minepets</a></li>
            <li class='nav-item'><a class='nav-link' href='/evolvedminepet.html'>Evolved Minepets</a></li>
            <li class='nav-item'><a class='nav-link' href='/inventory.html'>Inventory</a></li>
            <li class='nav-item'><a class='nav-link' href='/fight.html'>Fight</a></li>
            <li class='nav-item'><a class='nav-link' href='/upgrade.html'>Upgrade</a></li>
          </ul>
          <ul class='navbar-nav ms-auto'>
            <li class='nav-item'><a id='profileButton' href='/profile.html' class='nav-link'>Profile</a></li>
            <li class='nav-item'><a id='loginButton' href='/login.html' class='nav-link'>Login</a></li>
            <li class='nav-item'><a id='registerButton' href='/register.html' class='nav-link'>Register</a></li>
            <li class='nav-item'><a id='logoutButton' href='#' class='nav-link'>Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class='py-5'>
      <div class='container'>
        <div class='row justify-content-center'>
          <div class='col-md-6'>
            <div class='mc-panel p-4'>
              <h2 class='text-center mb-4'>Register</h2>
              <form id='registerForm'>
                <div class='mb-3'>
                  <label for='username' class='form-label'>Username</label>
                  <input type='text' class='form-control' id='username' name='username' autocomplete='username' required />
                </div>
                <div class='mb-3'>
                  <label for='email' class='form-label'>Email</label>
                  <input type='email' class='form-control' id='email' name='email' autocomplete='email' required />
                </div>
                <div class='mb-3'>
                  <label for='password' class='form-label'>Password</label>
                  <input type='password' class='form-control' id='password' name='password' autocomplete='new-password' required />
                </div>
                <button type='submit' class='btn btn-mc w-100'>Register</button>
              </form>
              <div id='warningText' class='alert alert-danger d-none mt-3'></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class='mc-footer py-3 text-center'>
      <div class='container'>
        <small>Create your MinePets account to start earning Emeralds.</small>
      </div>
    </footer>

    <script
      src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'
    ></script>
    <script src='/js/api.js'></script>
    <script src='/js/auth.js'></script>
    <script src='/js/ui.js'></script>
    <script src='/js/navbar.js'></script>
    <script src='/js/register.js'></script>
  </body>
</html>
